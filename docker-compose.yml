# Par défaut, seul PostgreSQL démarre (développement local : `docker compose up -d`).
# Stack complète (PostgreSQL + Strapi + Next.js) : `docker compose --profile full up --build`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-communaute}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    profiles: ["full"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/api/categories > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    profiles: ["full"]
    build: ./frontend
    environment:
      STRAPI_URL: http://strapi:1337
      # Démo en HTTP : le cookie de session ne peut pas être « Secure » (Safari le refuserait).
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      strapi:
        condition: service_healthy

volumes:
  pgdata:
